backend:
  name: git-gateway
  branch: master
  commit_messages:
    create: "blog: create {{slug}}"
    update: "blog: update {{slug}}"
    delete: "blog: delete {{slug}}"
    uploadMedia: "blog: upload {{path}}"

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Post"
    folder: "public/blog/posts"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{year}}-{{month}}-{{day}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - {
          label: "Body",
          name: "body",
          widget: "markdown",
          hint: "Separate paragraphs with a blank line.",
        }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options: ["Tech", "Education", "IoT", "Frontend"],
        }
      - { label: "Date", name: "date", widget: "datetime", format: "MMMM D, YYYY" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - {
          label: "Medium Link",
          name: "medium_link",
          widget: "string",
          required: false,
        }
      - {
          label: "Tags",
          name: "tags",
          widget: "list",
          default: [],
          field: { label: "Tag", name: "tag", widget: "string" },
        }
      - {
          label: "Read Time",
          name: "readTime",
          widget: "string",
          default: "5 min read",
        }
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default: false,
          hint: "Only one post should be featured.",
        }
